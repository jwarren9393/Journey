name: Release

on:
  push:
    tags:
      - 'build-*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package portable zip
        shell: pwsh
        run: |
          $build = "${{ github.ref_name }}".Replace('build-', '')
          $source = "build/windows/x64/runner/Release"
          $archive = "journey-windows-x64-build-$build.zip"
          Compress-Archive -Path "$source/*" -DestinationPath $archive
          echo "ARCHIVE_NAME=$archive" >> $env:GITHUB_ENV

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: journey-windows-x64
          path: journey-windows-x64-build-*.zip

  build-android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          BUILD="${GITHUB_REF_NAME#build-}"
          cp build/app/outputs/flutter-apk/app-release.apk "journey-android-build-$BUILD.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: journey-android
          path: journey-android-build-*.apk

  publish:
    name: Publish GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: journey-windows-x64

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: journey-android

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            journey-windows-x64-build-*.zip
            journey-android-build-*.apk
